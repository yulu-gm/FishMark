name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fishmark-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused architecture and regression tests
        run: >
          npm run test --
          src/main/renderer-production-bundle-boundaries.test.ts
          src/main/vite-bundle-provenance.test.ts
          src/main/analyze-renderer-bundle.test.ts
          src/main/editor-foundation-architecture.test.ts
          src/main/build-win-release.test.ts
          src/main/build-mac-release.test.ts
          src/main/package-scripts.test.ts
          src/main/ipc/register-workspace-handlers.test.ts
          src/main/workspace-file-identity-races.integration.test.ts
          src/main/main.test.ts
          src/renderer/performance/editor-foundation-baseline.test.ts
          src/renderer/outline.test.ts
          src/renderer/document-metrics.test.ts
          src/renderer/editor/useDocumentDerivedDataController.test.tsx
      - name: Build
        run: npm run build
      - name: Verify tests/build did not modify tracked repository files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::CI commands modified tracked repository files."
            git status --short
            git diff -- .
            exit 1
          fi

  regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare workspace runtime
        run: npm run dev:prepare
      - name: Run complete Vitest suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci
          npm run test -- --reporter=default --reporter=json --outputFile.json=.artifacts/ci/vitest-full.json 2>&1 | tee .artifacts/ci/vitest-full.log
      - name: Verify regression tests did not modify tracked files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Regression tests modified tracked repository files."
            git status --short
            git diff -- .
            exit 1
          fi
      - name: Capture reproducible regression inputs
        if: failure() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci/repro
          git archive --format=tar HEAD | gzip > .artifacts/ci/repro/source.tar.gz
          tar -czf .artifacts/ci/repro/dependencies.tar.gz node_modules
          node --version > .artifacts/ci/repro/runtime.txt
          npm --version >> .artifacts/ci/repro/runtime.txt
          git rev-parse HEAD >> .artifacts/ci/repro/runtime.txt
      - name: Upload isolated reproduction inputs
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: regression-repro-${{ github.sha }}
          path: .artifacts/ci/repro/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
      - name: Upload full regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-full-${{ github.sha }}
          path: .artifacts/ci/vitest-full.*
          if-no-files-found: warn
          retention-days: 14

  bundle:
    name: Bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run renderer bundle contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci
          npm run perf:bundle 2>&1 | tee .artifacts/ci/perf-bundle.log
      - name: Verify bundle analysis did not modify tracked repository files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Bundle analysis modified tracked repository files."
            git status --short
            git diff -- .
            exit 1
          fi
      - name: Upload bundle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-bundle-${{ github.sha }}
          path: .artifacts/ci/perf-bundle.log
          if-no-files-found: warn
          retention-days: 14
